<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232B3A"/>
      <stop offset="100%" stop-color="#161B24"/>
    </linearGradient>
    <linearGradient id="nGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C5FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ringGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="moonGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Framing Disc -->
  <circle cx="100" cy="100" r="94" fill="url(#darkBg)" stroke="#384353" stroke-width="2"/>

  <!-- Rear Orbit Ring -->
  <g transform="translate(100, 100) rotate(-24)">
    <path d="M -72 0 A 72 23 0 0 1 72 0" 
          fill="none" 
          stroke="url(#ringGradD)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.55"/>
  </g>

  <!-- Letter N -->
  <path d="M 54 150 L 54 50 L 146 150 L 146 50" 
        fill="none" 
        stroke="url(#nGradD)" 
        stroke-width="19" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowDark)"/>

  <!-- Front Orbit Ring -->
  <g transform="translate(100, 100) rotate(-24)">
    <path d="M 72 0 A 72 23 0 0 1 -72 0" 
          fill="none" 
          stroke="url(#ringGradD)" 
          stroke-width="8.5" 
          stroke-linecap="round"
          filter="url(#glowDark)"/>

    <!-- Moon -->
    <circle cx="58" cy="13.5" r="7.5" fill="url(#moonGradD)"/>
    <circle cx="58" cy="13.5" r="10.5" fill="none" stroke="#A7F3D0" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
