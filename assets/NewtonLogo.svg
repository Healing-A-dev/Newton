<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Bright Pastel Gradients -->
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Rear of Orbit Ring (GravityVM back-arc) -->
  <g transform="translate(100, 100) rotate(-24)">
    <path d="M -72 0 A 72 23 0 0 1 72 0" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.5"/>
  </g>

  <!-- Bold, Iconic Letter N (Newton) -->
  <path d="M 54 150 L 54 50 L 146 150 L 146 50" 
        fill="none" 
        stroke="url(#nGrad)" 
        stroke-width="19" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Front of Orbit Ring (GravityVM front-arc) -->
  <g transform="translate(100, 100) rotate(-24)">
    <path d="M 72 0 A 72 23 0 0 1 -72 0" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="8.5" 
          stroke-linecap="round"
          filter="url(#softGlow)"/>

    <!-- Gliding Gravitational Moon / Particle -->
    <circle cx="58" cy="13.5" r="7.5" fill="url(#moonGrad)"/>
    <circle cx="58" cy="13.5" r="10.5" fill="none" stroke="#6EE7B7" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
